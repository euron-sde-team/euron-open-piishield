# ─────────────────────────────────────────────────────────────────────────────
# Euron Open PIIShield: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
# (scripts/test-db.sh is the one exception: it starts only the data services from here.)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports, all on 127.0.0.1 (override in .env if they clash with something you run;
# see docs/PLAN.md "Ports (project 15)"):
#   web 5510   api 5530   postgres 5542   mock AI 5550   mailpit 5525 (SMTP 5526)
#   floci 5566   redis 5579
# ─────────────────────────────────────────────────────────────────────────────
name: piishield

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile
  target: server

x-api-env: &api-env
  # Development mode: the local stack talks to an emulator and links to localhost, both
  # of which the production guards refuse on purpose.
  ENVIRONMENT: development
  PIISHIELD_CLOUD: local
  LOG_LEVEL: ${PS_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://piishield:piishield@postgres:5432/piishield
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  # The vault's envelope encryption: a local key kept outside the database
  # (compose.floci.yaml switches to KMS).
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/exports
  COOKIE_SECURE: "false"
  # The web container proxies /api with X-Forwarded-For; trust it on the Compose network.
  # On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${PS_WEB_PORT:-5510},http://127.0.0.1:${PS_WEB_PORT:-5510}
  PUBLIC_URL: http://localhost:${PS_WEB_PORT:-5510}
  # Where the SDKs and CLI reach the API.
  PUBLIC_API_URL: http://localhost:${PS_API_PORT:-5530}
  # `piishield seed-demo` (run via `make demo`, inside the api container) is a real HTTP
  # client against the API and the mock AI service, over the Compose network, not a
  # direct database write, so it needs their in-network addresses, not the host-mapped
  # localhost ports the browser/SDKs use.
  PIISHIELD_API_URL: http://localhost:8080
  PIISHIELD_MOCK_AI_URL: http://mockai:5250
  SIGNUP_ENABLED: "true"
  # Review queue and scan report notifications land in Mailpit (http://localhost:5525).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM_ADDRESS: notifications@piishield.local
  AWS_SECRETS_ENABLED: "false"
  # The mock AI/LLM service: the AI gateway's demo seed and the integration suite call
  # through it, so `make demo` and `make e2e` need no real provider key.
  MOCK_AI_URL: http://mockai:5250
  # `make demo`: the seeded organisation's login. Must match the Makefile's DEMO_PW and
  # demo/seed.py's own DEMO_PASSWORD default.
  PIISHIELD_DEMO_PASSWORD: ${PIISHIELD_DEMO_PASSWORD:-Demo-Owner-Pass-1}

x-server: &server
  image: piishield-server:local
  read_only: true
  tmpfs:
    - /tmp:uid=10001,gid=10001
  restart: unless-stopped

x-probe: &probe
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: piishield
      POSTGRES_USER: piishield
      POSTGRES_PASSWORD: piishield
    ports:
      - "127.0.0.1:${PS_PG_PORT:-5542}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piishield -d piishield"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Policy cache (API key lookup, required categories, masking method per category,
  # confidence threshold), the tokenization scope map (value-to-placeholder mapping for
  # an in-flight request/session scope) and the dashboard aggregate response cache.
  # noeviction: the policy version stamp must never be evicted to make room, or a
  # replica would keep serving a stale API key or masking rule past its TTL.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PS_REDIS_PORT:-5579}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Catches every email the app sends (SMTP 1025, web UI on 5525, SMTP on 5526 for tests).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${PS_MAILPIT_PORT:-5525}:8025"
      - "127.0.0.1:${PS_SMTP_PORT:-5526}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *probe
    restart: unless-stopped

  # Mock AI/LLM provider: a deterministic chat-completion endpoint the AI gateway's
  # protect/restore flow calls through, with no key and no network, so `make demo` and
  # the integration and e2e suites can exercise a real protect-then-restore round trip
  # (AC9). The real implementation lives at apps/api/src/piishield/mockai (a subpackage
  # of the same piishield distribution the api service runs, so it ships in the same
  # image with no extra install step); this service entry only wires the port, health
  # check and environment it is expected to expose.
  mockai:
    <<: *server
    build: *server-build
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "piishield.mockai.app:app", "--host", "0.0.0.0", "--port", "5250", "--no-access-log"]
    ports:
      - "127.0.0.1:${PS_MOCK_AI_PORT:-5550}:5250"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5250/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe

  # Migrate first: the api starts only once the schema (organizations, users, projects,
  # api_keys, policies, recognizers, scan_events, findings, vault_entries, review_items,
  # database_scan_results and the rest of docs/PLAN.md's data model) is in place.
  migrate:
    <<: *server
    command: ["migrate"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${PS_API_PORT:-5530}:8080"
    volumes:
      - exports:/data/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      <<: *probe
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      mockai:
        condition: service_healthy

  # The dashboard. The browser talks to this origin; Next rewrites /api to the api on the
  # Compose network.
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
      args:
        API_URL: http://api:8080
    image: piishield-web:local
    environment:
      API_URL: http://api:8080
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${PS_WEB_PORT:-5510}:8080"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      <<: *probe
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  exports:
