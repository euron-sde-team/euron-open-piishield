openapi: 3.1.0
info:
  title: Euron Open PIIShield
  description: "\nDetects, masks, redacts, tokenizes and anonymizes personal and financial data across\n\
    text, JSON, documents and AI agent prompts/responses.\n\n* **People** sign in with `POST /api/v1/auth/signup`\
    \ or `/api/v1/auth/login` and use the\n  session token as `Authorization: Bearer <token>`.\n* **Automation\
    \ / SDKs** use a project API key: `Authorization: Bearer pii_...`. A read key\n  can scan and read;\
    \ a write key can also mask, redact, tokenize and manage policies.\n* **Vault access** (detokenizing\
    \ a placeholder back to its original value) is a separate\n  permission from any role or key scope:\
    \ an owner must explicitly grant it with\n  `POST /api/v1/vault/grants`.\n* Every scan, mask, redact,\
    \ tokenize and detokenize call is recorded in the audit log\n  (`GET /api/v1/audit`), which never\
    \ contains an original value or a vault mapping.\n"
  version: 0.1.0
