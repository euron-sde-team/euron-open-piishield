components:
  schemas:
    ApiKeyCreated:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        scope:
          type: string
          title: Scope
        key:
          type: string
          title: Key
      type: object
      required:
      - id
      - name
      - prefix
      - scope
      - key
      title: ApiKeyCreated
      description: 'Returned exactly once, at creation. The plaintext key is never retrievable again:

        only its prefix and hash are stored (matching the sibling project''s API key pattern).'
    ApiKeyIn:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scope:
          type: string
          enum:
          - read
          - write
          title: Scope
          default: read
      additionalProperties: false
      type: object
      required:
      - project_id
      - name
      title: ApiKeyIn
    ApiKeyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        scope:
          type: string
          title: Scope
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - prefix
      - scope
      - revoked_at
      - last_used_at
      - created_at
      title: ApiKeyOut
    AuditEntryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        actor_kind:
          type: string
          title: Actor Kind
        actor_label:
          type: string
          title: Actor Label
        action:
          type: string
          title: Action
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
        finding_count:
          type: integer
          title: Finding Count
        categories:
          items:
            type: string
          type: array
          title: Categories
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - id
      - created_at
      - actor_kind
      - actor_label
      - action
      - project_id
      - finding_count
      - categories
      - details
      title: AuditEntryOut
    AuditPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditEntryOut'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: AuditPage
    Body_protect_document_api_v1_documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_protect_document_api_v1_documents_post
    CategoryCount:
      properties:
        category:
          type: string
          title: Category
        count:
          type: integer
          title: Count
      type: object
      required:
      - category
      - count
      title: CategoryCount
    ColumnFinding:
      properties:
        column:
          type: string
          title: Column
        category:
          type: string
          title: Category
        confidence:
          type: number
          title: Confidence
        sample_hits:
          type: integer
          title: Sample Hits
      type: object
      required:
      - column
      - category
      - confidence
      - sample_hits
      title: ColumnFinding
    CustomRecognizerIn:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          maxLength: 80
          minLength: 1
