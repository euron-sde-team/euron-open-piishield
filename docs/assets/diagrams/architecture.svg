<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">PIIShield architecture</title>
  <desc id="d">Applications, the AI gateway caller and the dashboard call the API. The API uses Postgres for every durable table, Redis or in-process memory for the policy cache and tokenization scope map, and a local envelope-encryption sealer for the vault. There is no separate worker service: the dashboard summary is computed live from Postgres on each request, behind the same 15-second response cache. Floci emulates AWS locally for KMS, S3 and Secrets Manager, none of which 0.1.0's app code calls yet.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="620" rx="16" fill="#f6f7fb"/>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- clients -->
    <text x="40" y="44" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">CALLERS</text>
    <g filter="url(#s)">
      <rect x="40" y="62" width="200" height="64" rx="12" fill="#fff"/>
      <rect x="40" y="142" width="200" height="64" rx="12" fill="#fff"/>
      <rect x="40" y="222" width="200" height="64" rx="12" fill="#fff"/>
      <rect x="40" y="420" width="200" height="64" rx="12" fill="#fff"/>
    </g>
    <text x="60" y="90" font-size="15" font-weight="600">Backend services</text>
    <text x="60" y="110" font-size="12" fill="#64748b">Python/Node SDK, CLI</text>
    <text x="60" y="170" font-size="15" font-weight="600">AI-calling app</text>
    <text x="60" y="190" font-size="12" fill="#64748b">protect before the model, restore after</text>
    <text x="60" y="250" font-size="15" font-weight="600">Database operator</text>
    <text x="60" y="270" font-size="12" fill="#64748b">read-only column scan, connection per call</text>
    <text x="60" y="448" font-size="15" font-weight="600">Dashboard user</text>
    <text x="60" y="468" font-size="12" fill="#64748b">Next.js, session cookie</text>

    <!-- api -->
    <rect x="320" y="52" width="400" height="300" rx="16" fill="#f3eaff"/>
    <text x="344" y="84" font-size="16" font-weight="700" fill="#5b21b6">API  /api/v1</text>
    <text x="344" y="104" font-size="12" fill="#7c3aed">FastAPI, stateless, N replicas</text>
    <g font-size="12.5" fill="#1e1b4b">
      <rect x="344" y="122" width="168" height="34" rx="9" fill="#fff"/><text x="358" y="144">1 Authenticate</text>
      <rect x="524" y="122" width="168" height="34" rx="9" fill="#fff"/><text x="538" y="144">2 Load policy</text>
      <rect x="344" y="166" width="168" height="34" rx="9" fill="#fff"/><text x="358" y="188">3 Detect + checksum</text>
      <rect x="524" y="166" width="168" height="34" rx="9" fill="#fff"/><text x="538" y="188">4 Threshold / review</text>
      <rect x="344" y="210" width="168" height="34" rx="9" fill="#fff"/><text x="358" y="232">5 Mask / redact / tokenize</text>
      <rect x="524" y="210" width="168" height="34" rx="9" fill="#fff"/><text x="538" y="232">6 Seal to vault</text>
      <rect x="344" y="254" width="348" height="34" rx="9" fill="#7c3aed"/><text x="358" y="276" fill="#fff">7 Respond: protected content + findings, never the original value</text>
      <rect x="344" y="298" width="348" height="34" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="358" y="320">8 Record scan event + audit log, commit</text>
    </g>

    <!-- mock ai -->
    <g filter="url(#s)">
      <rect x="760" y="62" width="200" height="64" rx="12" fill="#fff"/>
    </g>
    <text x="780" y="90" font-size="15" font-weight="600">mock AI :5550</text>
    <text x="780" y="110" font-size="12" fill="#64748b">called by make demo and the SDK/e2e suites, never by the api itself</text>

    <!-- postgres -->
    <g filter="url(#s)">
      <rect x="760" y="222" width="200" height="64" rx="12" fill="#fff"/>
    </g>
    <text x="780" y="250" font-size="15" font-weight="600">Postgres :5542</text>
    <text x="780" y="270" font-size="12" fill="#64748b">org_id on every table</text>

    <!-- redis -->
    <g filter="url(#s)">
      <rect x="760" y="302" width="200" height="64" rx="12" fill="#fff"/>
    </g>
    <text x="780" y="330" font-size="15" font-weight="600">Redis :5579</text>
    <text x="780" y="350" font-size="12" fill="#64748b">policy version, scope map (optional)</text>

    <!-- floci -->
    <g filter="url(#s)">
      <rect x="760" y="382" width="200" height="82" rx="12" fill="#fff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    </g>
    <text x="780" y="410" font-size="15" font-weight="600">Floci :5566</text>
    <text x="780" y="430" font-size="12" fill="#64748b">KMS, S3, Secrets Manager</text>
    <text x="780" y="448" font-size="11" fill="#94a3b8">provisioned, not yet called</text>

    <!-- local sealer -->
    <g filter="url(#s)">
      <rect x="40" y="520" width="920" height="60" rx="12" fill="#fff" stroke="#c4b5fd"/>
    </g>
    <text x="60" y="545" font-size="14" font-weight="600" fill="#5b21b6">local Sealer (0.1.0)</text>
    <text x="60" y="564" font-size="12" fill="#64748b">AES-256-GCM, key from LOCAL_MASTER_KEY, context-bound to each vault row. key_mode=kms is the roadmap backend, same Protocol.</text>

    <!-- arrows -->
    <path d="M240 94L320 94" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M240 174L320 160" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M240 254L320 220" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M240 452L320 300" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M720 160L760 254" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M720 290L760 334" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)" fill="none"/>
    <path d="M500 352L500 520" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#g)" fill="none"/>
  </g>
</svg>
